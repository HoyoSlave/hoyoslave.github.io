<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta property="og:title" content="Alfana Sofyan" />
    <meta
      property="og:description"
      content="Developing shell scripts to optimize and improve Android performance."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/HoyoSlave/hoyoslave.github.io/main/Pictures/pfp.jpg"
    />
    <meta property="og:url" content="https://hoyoslave.github.io" />
    <meta property="og:type" content="website" />
    <title>Alfan's Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Inter", sans-serif;
        line-height: 1.6;
        color: #e6e6e6;
        background-color: #0f1419;
        overflow-x: hidden;
      }

      /* HEADER BAR (Pfp Kecil & Tersusun Mendatar) */
      .header-bar {
        background-color: #191e23;
        padding: 1rem 2rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .profile-info {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .pfp-icon {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: url(Pictures/pfp.jpg) center/cover no-repeat;
        border: 2px solid #1919e6;
      }
      .profile-text h1 {
        font-size: 1.2rem;
        font-weight: 700;
        color: #1919e6;
      }
      .profile-text p {
        font-size: 0.85rem;
        color: #ccc;
      }
      .header-cta {
        display: flex;
        gap: 0.8rem;
      }

      /* BUTTONS */
      .btn {
        padding: 0.5rem 1.2rem;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        border-radius: 45px;
        transition: 0.3s;
      }
      .btn-primary {
        color: #fff;
        border: 2px solid #1919e6;
      }
      .btn-primary:hover {
        background: #1919e6;
      }
      .btn-secondary {
        color: #fff;
        border: 2px solid #e6e619;
      }
      .btn-secondary:hover {
        background: #e6e619;
        color: #000;
      }

      /* PORTFOLIO SECTION */
      .portofolio {
        padding: 4rem 1.5rem;
        max-width: 1000px;
        margin: 0 auto;
      }
      .section-title {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 2.5rem;
        color: #fff;
      }
      .portofolio-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
      }
      .portofolio-item {
        position: relative;
        border-radius: 15px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: transform 0.3s ease;
      }
      .portofolio-item:hover {
        transform: translateY(-5px);
        border-color: #1919e6;
      }
      .portofolio-image img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
        filter: brightness(40%); /* Membuat gambar gelap */
        transition: filter 0.3s ease;
      }
      .portofolio-item:hover .portofolio-image img {
        filter: brightness(60%); /* Sedikit lebih terang saat di-hover */
      }
      
      /* TEXT OVERLAY PADA GAMBAR */
      .portofolio-content {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 1.5rem;
        pointer-events: none; /* Supaya klik tetap tembus ke tag <a> */
      }
      .portofolio-title {
        color: #fff;
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 0.2rem;
      }
      .portofolio-description {
        color: #ddd;
        font-size: 0.9rem;
      }

      /* ANIMASI FADE-IN */
      .fade-in {
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.6s ease;
      }
      .fade-in.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* RESPONSIVE MOBILE */
      @media (max-width: 768px) {
        .header-bar {
          justify-content: center;
          text-align: center;
        }
        .profile-info {
          flex-direction: column;
        }
        .portofolio-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    
    <header class="header-bar fade-in">
      <div class="profile-info">
        <div class="pfp-icon"></div>
        <div class="profile-text">
          <h1>Alfana Sofyan</h1>
          <p>Developing shell scripts to optimize & improve Android performance</p>
        </div>
      </div>
      <div class="header-cta">
        <a href="https://t.me/hoyoslave" class="btn btn-primary">Contact</a>
        <a href="https://t.me/S_O_S_P/5" class="btn btn-secondary">Donate</a>
      </div>
    </header>

    <section id="portofolio" class="portofolio">
      <h2 class="section-title fade-in">Projects</h2>
      <div class="portofolio-grid">
        
        <div class="portofolio-item fade-in">
          <a href="https://t.me/S_O_S_P/2329" style="text-decoration: none;">
            <div class="portofolio-image">
              <img src="Pictures/cmd.jpg" alt="CMD" />
            </div>
            <div class="portofolio-content">
              <h3 class="portofolio-title">CMD-Tweaks</h3>
              <p class="portofolio-description">AIO system optimization (main project)</p>
            </div>
          </a>
        </div>

        <div class="portofolio-item fade-in">
          <a href="https://t.me/S_O_S_P/1763" style="text-decoration: none;">
            <div class="portofolio-image">
              <img src="Pictures/sac.jpg" alt="SAC" />
            </div>
            <div class="portofolio-content">
              <h3 class="portofolio-title">Shell-Ascend</h3>
              <p class="portofolio-description">System tuning tool (main project)</p>
            </div>
          </a>
        </div>

        <div class="portofolio-item fade-in">
          <a href="https://t.me/S_O_S_P/1682" style="text-decoration: none;">
            <div class="portofolio-image">
              <img src="Pictures/uec.jpg" alt="UEC" />
            </div>
            <div class="portofolio-content">
              <h3 class="portofolio-title">Unreal-Config</h3>
              <p class="portofolio-description">Adjust unreal engine graphics quality</p>
            </div>
          </a>
        </div>

      </div>
    </section>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const observer = new IntersectionObserver(
          entries => {
            entries.forEach(entry => {
              if (entry.isIntersecting)
                entry.target.classList.add("visible");
            });
          },
          { threshold: 0.1 }
        );
        document
          .querySelectorAll(".fade-in")
          .forEach(el => observer.observe(el));
      });
    </script>
  </body>
</html>
